name: Release

on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pack dist
        run: |
          cd dist
          zip -r ../OneTerminal.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: OneTerminal.zip
          generate_release_notes: true
